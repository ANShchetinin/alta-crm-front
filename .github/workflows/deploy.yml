name: Build and Deploy Frontend

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: gitverse.ru
  IMAGE_NAME: aschetinin/alta-crm-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build frontend
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_DADATA_API_KEY: ${{ secrets.VITE_DADATA_API_KEY || '66396b2e45d9ff46356592aae66a087ead7d082e' }}
        run: |
          npm ci
          npm run build

      - name: Copy Dist to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d ' \n\r' | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/IdeaProjects/alta-crm/frontend-artifact && rm -rf /opt/IdeaProjects/alta-crm/frontend-artifact/*"
          scp -i ~/.ssh/id_rsa -r dist/* ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/opt/IdeaProjects/alta-crm/frontend-artifact/
          scp -i ~/.ssh/id_rsa Dockerfile.local ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/opt/IdeaProjects/alta-crm/Dockerfile.frontend.local
          scp -i ~/.ssh/id_rsa nginx.conf ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/opt/IdeaProjects/alta-crm/nginx.conf

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d ' \n\r' | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
            cd /opt/IdeaProjects/alta-crm
            
            # Обновляем переменные
            sed -i 's|^FRONTEND_VERSION=.*|FRONTEND_VERSION=${GITHUB_REF_NAME}|g' .env
            sed -i 's|^DOCKER_REGISTRY=.*|DOCKER_REGISTRY=|g' .env
            grep -q '^FRONTEND_VERSION=' .env || echo 'FRONTEND_VERSION=${GITHUB_REF_NAME}' >> .env
            grep -q '^DOCKER_REGISTRY=' .env || echo 'DOCKER_REGISTRY=' >> .env
            
            # Копируем dist в папку фронтенда (на сервере Dockerfile соберет образ)
            rm -rf frontend-dist && cp -r frontend-artifact frontend-dist
            
            # Собираем Docker образ фронтенда с Nginx
            docker build -t altacrm-frontend:${GITHUB_REF_NAME} -t altacrm-frontend:latest -f Dockerfile.frontend.local .
            
            docker-compose up -d --no-deps frontend
          "

