name: Build and Deploy Frontend

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build frontend
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_DADATA_API_KEY: ${{ secrets.VITE_DADATA_API_KEY || '66396b2e45d9ff46356592aae66a087ead7d082e' }}
        run: |
          npm ci
          npm run build

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d ' \n\r' | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          
          # Очищаем и копируем dist на сервер в frontend-dist
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/IdeaProjects/alta-crm/frontend-dist && rm -rf /opt/IdeaProjects/alta-crm/frontend-dist/*"
          scp -i ~/.ssh/id_rsa -r dist/* ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/opt/IdeaProjects/alta-crm/frontend-dist/
          scp -i ~/.ssh/id_rsa Dockerfile.local ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/opt/IdeaProjects/alta-crm/Dockerfile.frontend.local
          scp -i ~/.ssh/id_rsa nginx.conf ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/opt/IdeaProjects/alta-crm/nginx.conf
          
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
            cd /opt/IdeaProjects/alta-crm
            
            # Обновляем переменные в .env
            sed -i 's|^FRONTEND_VERSION=.*|FRONTEND_VERSION=${{ github.ref_name }}|g' .env
            sed -i 's|^DOCKER_REGISTRY=.*|DOCKER_REGISTRY=|g' .env
            grep -q '^FRONTEND_VERSION=' .env || echo 'FRONTEND_VERSION=${{ github.ref_name }}' >> .env
            grep -q '^DOCKER_REGISTRY=' .env || echo 'DOCKER_REGISTRY=' >> .env
            
            # Собираем Docker образ фронтенда
            docker build -t altacrm-frontend:${{ github.ref_name }} -t altacrm-frontend:latest -f Dockerfile.frontend.local .
            
            # Перезапускаем контейнер фронтенда с новым образом
            docker-compose up -d --force-recreate --no-deps frontend
          "

