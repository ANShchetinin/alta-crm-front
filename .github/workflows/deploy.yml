name: Build and Deploy Frontend

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: gitverse.ru
  IMAGE_NAME: aschetinin/alta-crm-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Copy Dist to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/IdeaProjects/alta-crm/frontend-artifact"
          scp -i ~/.ssh/id_rsa -r dist/* ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/opt/IdeaProjects/alta-crm/frontend-artifact/

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/IdeaProjects/alta-crm
            
            # Обновляем переменные
            sed -i "s|^FRONTEND_VERSION=.*|FRONTEND_VERSION=${GITHUB_REF_NAME}|g" .env
            sed -i "s|^DOCKER_REGISTRY=.*|DOCKER_REGISTRY=|g" .env
            grep -q "^FRONTEND_VERSION=" .env || echo "FRONTEND_VERSION=${GITHUB_REF_NAME}" >> .env
            grep -q "^DOCKER_REGISTRY=" .env || echo "DOCKER_REGISTRY=" >> .env
            
            # Копируем dist в папку фронтенда (на сервере Dockerfile соберет образ)
            rm -rf frontend-dist && cp -r frontend-artifact frontend-dist
            
            # Собираем Docker образ локально на сервере
            docker build -t aschetinin/alta-crm-front:${GITHUB_REF_NAME} -t aschetinin/alta-crm-front:latest -f Dockerfile.local .
            
            docker-compose up -d --no-deps frontend
