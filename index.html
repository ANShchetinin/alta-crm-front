<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0f172a" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="apple-status-bar" />
    <meta name="apple-mobile-web-app-title" content="Alta CRM" />
    <meta name="application-name" content="Alta CRM" />
    
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('altacrm_theme') || 'dark';
          var isLight = theme === 'light';
          document.documentElement.style.colorScheme = isLight ? 'light' : 'dark';
          if (isLight) {
            document.documentElement.classList.add('light-theme');
            var metaTheme = document.getElementById('theme-color-meta');
            if (metaTheme) metaTheme.setAttribute('content', '#ffffff');
            var appleBar = document.getElementById('apple-status-bar');
            if (appleBar) appleBar.setAttribute('content', 'default');
          }
        } catch (e) {}
      })();
    </script>
    
    <title>AltaCRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
