# Cache-Control по URI (после try_files SPA-маршруты приходят сюда как /index.html).
# Задается через map, а не через add_header в location: add_header внутри location отменяет
# все add_header уровня server, включая заголовки безопасности ниже.
map $uri $cache_control {
    # Don't cache index.html, service worker, and webmanifest so PWA and browser updates are instant
    ~*(index\.html|sw\.js|manifest\.webmanifest|push-worker\.js)$  "no-cache, no-store, must-revalidate";
    # Cache hashed JS/CSS assets indefinitely
    ~^/assets/                                                    "public, max-age=31536000, immutable";
    default                                                       "";
}

# Ответы /api уже содержат эти заголовки от Spring Security — не дублируем (пустое значение = заголовок не добавляется)
map $uri $frame_options {
    ~^/api/  "";
    default  "SAMEORIGIN";
}

map $uri $content_type_options {
    ~^/api/  "";
    default  "nosniff";
}

server {
    listen 80;
    client_max_body_size 100M;
    root /usr/share/nginx/html;

    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options $content_type_options always;
    add_header X-Frame-Options $frame_options always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    # CSP в режиме блокировки (проверено в Report-Only на проде). Новый внешний домен (CDN, API, хранилище) — сначала добавить сюда.
    # Внешние источники: Google Fonts, DaData, Yandex Object Storage (подписанные ссылки на файлы и аватары).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://storage.yandexcloud.net https://*.storage.yandexcloud.net; media-src 'self' data: blob: https://storage.yandexcloud.net https://*.storage.yandexcloud.net; connect-src 'self' https://suggestions.dadata.ru https://fonts.googleapis.com https://fonts.gstatic.com https://storage.yandexcloud.net https://*.storage.yandexcloud.net; frame-src 'self' blob: https://storage.yandexcloud.net https://*.storage.yandexcloud.net; object-src 'self' blob: https://storage.yandexcloud.net https://*.storage.yandexcloud.net; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Missing hashed assets must 404 instead of falling back to index.html
    location /assets/ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        # С портом: иначе Spring сочтет same-origin запрос (например, http://192.168.0.7:3000) кросс-доменным
        # и отклонит его по CORS-whitelist с 403
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100M;
    }
}
